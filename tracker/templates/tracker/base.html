<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SkjaldFit{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Подключение шрифтов Cormorant SC (вместо Cinzel) и Montserrat от Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kelly+Slab&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'tracker/css/styles.css' %}">

    <style>
        {% block extra_css %}{% endblock %}
    </style>
</head>

<body>

    <nav class="navbar navbar-dark navbar-custom mb-4 shadow-sm py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand rpg-title mb-0 h1">🛡️ SkjaldFit</span>
            <a href="{% url 'home' %}" class="btn btn-sm btn-outline-light d-flex align-items-center justify-content-center" style="border-color: var(--khaki); width: 34px; height: 34px;" title="Крепость">
                <span>🏰</span>
            </a>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-dismissible fade show shadow-sm mb-4"
                 role="alert"
                 style="background-color: var(--khaki); color: #ffffff; font-style: normal; border: none; border-left: 5px solid var(--brown, #7f4f24); text-shadow: 0px 1px 2px rgba(0,0,0,0.3);">
              <h5 class="fw-bold mb-2" style="color: #ffffff;">🔮 Славная битва!</h5>
              <div style="font-size: 0.95rem; line-height: 1.5; color: #ffffff;">{{ message }}</div>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    {% block extra_js %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
